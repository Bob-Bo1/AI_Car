<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小车Wi-Fi设置</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff3f8;color:#13283c;font:16px/1.7 "Microsoft YaHei",system-ui,sans-serif}header{padding:25px 24px;background:#13283c;color:#fff}header>div{max-width:640px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:18px}h1{font-size:23px;margin:0}#deviceLink{font-size:13px;color:#c3d6e5}main{max-width:680px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #dbe4ee;border-radius:20px;padding:30px}h2{margin:0 0 8px;font-size:23px}p{margin:8px 0 20px}.muted{font-size:14px;color:#64758a}.steps{font-size:13px;color:#64758a;margin:0 0 23px}.steps b{color:#2068d5}label{display:block;margin:20px 0 6px}select,input,button{font:inherit;border-radius:10px;border:1px solid #dbe4ee;padding:12px;width:100%;background:#fff;color:#13283c}button{cursor:pointer;font-weight:600}button:disabled{opacity:.45;cursor:default}button.primary{background:#2068d5;color:white;border-color:#2068d5;margin-top:23px}.networkRow{display:flex;gap:10px}.networkRow select{flex:1;min-width:0}.networkRow button{width:auto;font-size:14px;white-space:nowrap}.hint{padding:14px;background:#eaf2fa;border-radius:12px;font-size:14px}.error{color:#9e2632;background:#fff0f0}.hiddenChoice{font-size:14px;color:#64758a}.hiddenChoice input{width:auto;margin-right:8px}a{color:#2068d5;overflow-wrap:anywhere}.entry{display:block;text-decoration:none;text-align:center;border:1px solid #2068d5;border-radius:10px;padding:12px;margin-top:18px}#connectionNote{min-height:24px}footer{font-size:12px;text-align:center;color:#64758a;margin:20px}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #82b4fc;outline-offset:3px}[hidden]{display:none!important}@media(max-width:520px){.card{padding:23px}main{margin:20px auto}header{padding:20px}h1{font-size:20px}}
</style>
<header><div><h1>小车Wi-Fi设置</h1><span id="deviceLink">正在连接小车…</span></div></header>
<main><div class="steps" id="steps"><b>选择Wi-Fi</b> → 连接网络 → 进入控制台</div>
<section class="card" id="chooseStep"><h2>连接家里的Wi-Fi</h2><p class="muted">先选择附近的2.4GHz网络，再输入密码。配网完成后进入驾驶界面。</p>
<form id="setupForm"><label for="networks">Wi-Fi名称</label><div class="networkRow"><select id="networks" required><option value="">正在扫描附近的Wi-Fi…</option></select><button id="refresh" type="button">重新扫描</button></div>
<p class="muted" id="scanNote">只显示小车支持的2.4GHz网络。</p><label class="hiddenChoice"><input type="checkbox" id="manual">手动输入隐藏网络</label><input id="manualSsid" maxlength="32" placeholder="输入Wi-Fi名称" hidden>
<label for="password">Wi-Fi密码</label><input type="password" id="password" maxlength="63" autocomplete="current-password" placeholder="输入所选Wi-Fi的密码">
<button class="primary" id="save" disabled>连接Wi-Fi</button></form><p class="hint" id="connectionNote" role="status">正在建立小车连接，请稍候。</p></section>
<section class="card" id="connectingStep" hidden><h2>正在连接Wi-Fi</h2><p id="connectingText">正在保存配置并等待路由器分配地址…</p><p class="hint">请保持小车供电，先不要切换电脑或手机的Wi-Fi。</p></section>
<section class="card" id="switchStep" hidden><h2>Wi-Fi已连接成功</h2><p>请将电脑或手机切回 <strong id="networkName"></strong>。</p><p class="hint" id="handoffNote">切回后会自动检测并进入控制台。网页无法替你切换系统Wi-Fi。</p><p class="muted">控制台地址：<a id="targetAddress"></a></p><a class="entry" id="enter">我已切回Wi-Fi，进入控制台</a><button type="button" id="again" style="margin-top:14px">重新选择Wi-Fi</button></section>
<footer>请使用系统浏览器 · 小车热点配网地址：192.168.4.1</footer></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let socket,token='',seq=0,state=null,phase='choose',claimPending=false,expected='',deadline=0,target='',identity='',probing=false,scanning=false,scanEpoch=0,attempts=0;
function note(text,error=false){$('connectionNote').textContent=text;$('connectionNote').classList.toggle('error',error);}
function show(next){phase=next;$('chooseStep').hidden=next!=='choose';$('connectingStep').hidden=next!=='connecting';$('switchStep').hidden=next!=='switch';$('steps').textContent=next==='switch'?'选择Wi-Fi → 连接成功 → 请切回家庭Wi-Fi':next==='connecting'?'选择Wi-Fi → 正在连接 → 进入控制台':'选择Wi-Fi → 连接网络 → 进入控制台';}
function send(type,fields={}){if(socket&&socket.readyState===1&&token){socket.send(JSON.stringify({type,token,seq:++seq,...fields}));return true;}return false;}
async function get(url){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),1800);try{const r=await fetch(url,{cache:'no-store',credentials:'omit',signal:controller.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(timer);}}
function selection(){const option=$('networks').selectedOptions[0];return $('manual').checked?{ssid:$('manualSsid').value.trim(),secure:true}:{ssid:$('networks').value,secure:!option||option.dataset.secure!=='false'};}
function render(){const ready=!!(socket&&socket.readyState===1&&token&&state&&!state.active&&!state.locked&&!state.fault);$('save').disabled=!ready||scanning;$('refresh').disabled=scanning||!state||state.active;$('password').required=selection().secure;}
function receive(s){state=s;if(s.token)token=s.token;if(s.device_id)identity=s.device_id;$('deviceLink').textContent=token?'小车已连接':'正在连接小车…';
 if(s.error){claimPending=false;show('choose');note(s.error,true);render();return;}
 if(claimPending&&s.you_control){claimPending=false;const selected=selection();expected=selected.ssid;deadline=Date.now()+35000;show('connecting');$('connectingText').textContent='正在连接“'+expected+'”…';send('wifi',{ssid:expected,password:$('password').value});$('password').value='';}
 else if(phase==='connecting'&&s.connected&&s.ssid===expected&&s.ip){target='http://'+s.ip+'/';$('networkName').textContent=s.ssid;$('targetAddress').textContent=target;$('targetAddress').href=target;$('enter').href=target;show('switch');try{sessionStorage.setItem('carSetupHandoff',JSON.stringify({target,identity,ssid:s.ssid}));}catch{}}
 if(phase==='choose'&&token)note(s.active?'小车正在运行，请先停车再配网。':'请选择Wi-Fi并输入密码。');render();}
function connect(){if(socket&&socket.readyState<2)return;token='';seq=0;socket=new WebSocket('ws://'+location.host+'/ws');const current=socket;current.onopen=()=>current.send(JSON.stringify({type:'hello'}));current.onmessage=e=>{if(current!==socket)return;try{receive(JSON.parse(e.data));}catch{note('状态读取失败，正在重试。',true);}};current.onerror=()=>current.close();current.onclose=()=>{if(current!==socket)return;token='';render();if(phase==='choose')note('小车连接中断，正在重试。',true);setTimeout(connect,1500);};}
async function scan(){if(scanning)return;scanning=true;const epoch=++scanEpoch;render();$('scanNote').textContent='正在扫描附近的2.4GHz Wi-Fi…';try{
 let result=await get('/api/wifi/scan?refresh=1');for(let i=0;i<35&&epoch===scanEpoch;i++){
  if(result.ready&&!result.scanning)break;await new Promise(resolve=>setTimeout(resolve,700));result=await get('/api/wifi/scan'+(!result.scanning?'?refresh=1':''));
 }
 if(!result.ready)throw new Error('scan pending');const previous=$('networks').value||state?.ssid||'';$('networks').replaceChildren();const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='请选择Wi-Fi';$('networks').append(placeholder);
 for(const network of result.networks){const option=document.createElement('option');option.value=network.ssid;option.textContent=network.ssid+' · '+(network.rssi>=-60?'信号强':network.rssi>=-75?'信号一般':'信号弱')+(network.secure?'':' · 无密码');option.dataset.secure=String(network.secure);$('networks').append(option);}
 if(result.networks.some(n=>n.ssid===previous))$('networks').value=previous;$('scanNote').textContent=result.networks.length?'找到'+result.networks.length+'个网络，只显示2.4GHz。':'没有找到网络，可重新扫描或手动输入。';
 }catch{$('scanNote').textContent='扫描暂未完成，请稍后点“重新扫描”，也可手动输入。';}finally{scanning=false;render();}}
async function probe(){if(phase!=='switch'||!target||probing)return;probing=true;try{const s=await get(target+'api/ready');if(s.device_id===identity&&s.connected&&!s.via_hotspot){$('handoffNote').textContent='已检测到家庭网络，正在进入控制台…';location.replace(target);return;}if(s.via_hotspot)$('handoffNote').textContent='小车已联网，你当前仍通过小车热点访问。请在系统Wi-Fi设置切回家庭网络。';}catch{if(++attempts>=5)$('handoffNote').textContent='等待切回家庭Wi-Fi。若浏览器阻止自动检测，切回后点击下方“进入控制台”。';}finally{probing=false;}}
$('setupForm').onsubmit=e=>{e.preventDefault();const selected=selection();if(!selected.ssid)return;if(!token||!state||state.active){note('请等待连接，并确认小车已停车。',true);return;}claimPending=true;send('claim',{takeover:true});$('save').disabled=true;};
$('manual').onchange=()=>{$('manualSsid').hidden=!$('manual').checked;$('manualSsid').required=$('manual').checked;$('networks').required=!$('manual').checked;$('networks').disabled=$('manual').checked;render();};$('networks').onchange=render;$('refresh').onclick=scan;$('again').onclick=()=>{show('choose');expected='';deadline=0;try{sessionStorage.removeItem('carSetupHandoff');}catch{};scan();};
window.addEventListener('online',probe);window.addEventListener('focus',()=>{connect();probe();});
setInterval(()=>{send('ping');if(phase==='connecting'&&Date.now()>deadline){show('choose');note('连接超时，请检查密码、信号和2.4GHz网络，再重新连接。',true);}},700);setInterval(probe,1800);
connect();scan();
})();
</script></html>
